  - campaign: cnn_20260913
    run: "Phase I slot 2 candidate v2ens_plus (17 members)"
    date: "2026-09-13"
    model: "v2ens + 2 all-data V2-Tiny refits (w2) + 5 V2-Base folds (w3), geometric mean, flip TTA"
    split: oof9000
    n: 9000
    mean: 8.814
    status: "built, not uploaded"
    verdict: "Fold-only OOF (refits unvalidatable). Replay max rel diff 2.7e-7; 31 s/case on a shared A5000 (limit 5 min/case). Recommended for slot 2. See results/cnn_20260913/c0_slot2/REPORT.md section 5."
    path: /home/visilant/CLEAR-EC-phase1-v2ens/results/phase1_v2ens_plus
  - campaign: detector_20260913
    run: "S2 detector CD readout (winfocus)"
    date: "2026-09-13"
    model: "heatmap U-Net (ConvNeXt-V2-Nano encoder) + Voronoi readout in focus-chosen 538x408 window"
    split: val892
    n: 892
    mean: 10.14
    status: "gate failed"
    verdict: "CD MAPE only (scaled 10.14, raw 10.35, log-corr 0.65) vs CNN OOF CD 6.32; ridge stack with the CNN 6.37 vs 6.32. Region emulation costs <1 point; the loss is transfer from 19 one-series overlays."
    path: results/detector_20260913/s2

  - campaign: platform
    run: "Phase I submission 2 (v2ens_plus, 17 members, baked bundle, image 38863e52)"
    date: "2026-09-14"
    model: "5x V2-Tiny folds w2 + 5x Tiny folds w1 + 2x V2-Tiny all-data refits w2 + 5x V2-Base folds w3, geometric mean, flip TTA"
    split: platform100
    n: 100
    mean: 8.8531
    status: submitted
    verdict: "Worse than slot 1 (8.7583) by +0.095 on the same 100 images; on the 9000-image OOF the paired 100-image delta was -0.023 +/- 0.046, so this is a 2.6-sigma outcome before the unvalidatable refits. Evaluation e18a55ed. Best-of ranking keeps 8.7583 (position 5 on 2026-09-14). V2-Base all-data refits (results/v2base_refit_20260914, seed 123 complete, seed 7 stopped) not submitted."
    path: results/cnn_20260913/c0_slot2

verdicts:  # levers tested; joined to rows by glob on "<campaign>/<run>" (docs/HANDOFF_2026-09-12.md section 4)
  - lever: "Label cleaning (drop top-2 percent flagged from training)"
    runs: ["noise_floor_20260912/b1_*"]
    verdict: "fails the 0.10 gate: delta -0.028 (CI -0.087 to +0.030) on 1,802 held-out images; test labels carry the same noise"
    do_not_rerun: true
  - lever: "Capacity: ConvNeXt-V2-Base, 5 folds"
    runs: ["noise_floor_20260912/b3_*", "night_20260912/x_v2base*"]
    verdict: "tie: OOF 8.871 vs 8.897 (CI -0.053 to -0.001) at 3.5x the cost; fails the 0.15 gate"
    do_not_rerun: true
  - lever: "Other backbones: ConvNeXt-Small, V2-Nano, DINOv2 ViT-S, pure-MAE V2 init"
    runs: ["night_20260912/x_small*", "night_20260912/x_v2nano*", "night_20260912/x_dinov2*", "night_20260912/x_v2fcmae*", "night_20260912/x_in12k*"]
    verdict: "lose or tie on the 892 val split (9.29 to 12.75 vs 9.21 to 9.27)"
    do_not_rerun: true
  - lever: "Longer training"
    runs: ["night_20260912/r3_*", "night_20260912/x_reg_e20*", "long_training_20260912_40ep/*"]
    verdict: "loses at the last epoch; V2 plateaus at epochs 7 to 8; 40 epochs is +0.046 worse than 8"
    do_not_rerun: true
  - lever: "Seeds and seed ensembles"
    runs: ["night_20260912/v2fold0_s42*", "night_20260912/r3_seed42*", "night_20260912/refit_seed42*"]
    verdict: "seeds correlate 0.994; a two-seed ensemble gains 0.02; nothing to average"
    do_not_rerun: true
  - lever: "Resolution, antialias, crops, log targets, weight decay, drop-path, half data"
    runs: ["night_20260912/x_highres*", "night_20260912/x_antialias*", "night_20260912/x_crop06*", "night_20260912/x_logspace*", "night_20260912/x_wd5e-2*", "night_20260912/x_dp03*", "night_20260912/x_half*", "convnext_20260911/*"]
    verdict: "all within 0.05 of the baseline on 892 val (half the data costs 0.05 to 0.09)"
    do_not_rerun: true
  - lever: "Detector-based Voronoi readout (SAM / Cellpose-SAM)"
    runs: ["sam_spike_20260912/*"]
    verdict: "detector recall 0.5 to 0.75, CD MAPE 21 to 35 percent vs a 6 percent gate; the only route to the CD headroom for Phase II"
    do_not_rerun: true
  - lever: "Flip TTA / best-epoch selection"
    runs: ["night_20260912/* [*+flips]"]
    verdict: "+0.02 to 0.03 / +0.02; TTA is in v2ens, best-epoch selection is not used (fixed budget)"
    do_not_rerun: false
  - lever: "Small-CNN normalization x seeds (round 1)"
    runs: ["round1_20260912_002113/*"]
    verdict: "BatchNorm beats GroupNorm by 0.5; three-seed ensemble +0.09 missed the 0.2 gate; superseded by ConvNeXt"
    do_not_rerun: true
  - lever: "Cellpose baseline and ridge calibration"
    runs: ["overnight/*", "audit_20260911/*"]
    verdict: "Cellpose 'cyto' outputs correlate 0.2 to 0.3 with GT CD; ridge (14.8) and the constant (14.2) beat it; superseded by direct regression"
    do_not_rerun: true

  - lever: "Trained cell-centre detector for CD (heatmap U-Net on the 19 overlays, +count supervision)"
    runs: ["detector_20260913/*"]
    verdict: "test-overlay recall 0.89 / F1 0.90 but val-892 CD MAPE 10.1 (S2) and ~8 with count supervision (S3) vs CNN 6.3; stack adds nothing. Needs overlays across series (Phase II)."
    do_not_rerun: yes
  - lever: "Trimmed relative loss (drop 1 of 8 per batch)"
    runs: ["cnn_20260913/trim*"]
    verdict: "two-fold screen: fold0 8.869 vs 8.750, fold1 8.648 vs 8.639 (last+flips); loses or ties"
    do_not_rerun: yes
  - lever: "Density-map CD head (sum of a softplus 1x1 map)"
    runs: ["cnn_20260913/density*"]
    verdict: "fold0: first parameterisation 10.43, reparameterised exp(log_scale)*mean 12.39 (CD 14.2, CV 11.7, HEX 11.3) vs 8.750; all three metrics worse, the head harms the shared backbone. Dead."
    do_not_rerun: yes
  - lever: "Label-transforming scale jitter (zoom s, CD x 1/s^2), +/-0.2 log-uniform"
    runs: ["cnn_20260913/sj02*"]
    verdict: "two-fold screen: fold0 8.944 vs 8.766, fold1 8.861 vs 8.639 (last epoch); CD worsens (6.90 vs 6.38 on fold 0), CV/HEX unchanged. Loses."
    do_not_rerun: yes
  - lever: "More ensemble families (V2-Tiny 648x864 five folds, ConvNeXt-Small five folds)"
    runs: ["cnn_20260913/v2hr*", "cnn_20260913/small*"]
    verdict: "single-model OOF 8.912 / 8.988; added to v2ens_plus: +0.0005 / -0.004, best five-family 8.809 vs 8.814 (CI -0.012 to +0.003). Ensemble ceiling reached; see results/cnn_20260913/c5_weights/REPORT.md."
    do_not_rerun: yes
