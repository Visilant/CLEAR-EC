    model: "5x ConvNeXt-V2-Tiny + 5x ConvNeXt-Tiny fold models, geometric mean, flip TTA"
    split: platform100
    n: 100
    mean: 8.7583
    status: submitted
    verdict: "4th of the Phase I leaderboard on 2026-09-12; top five 8.7042 / 8.7452 / 8.7550 / 8.7583 / 8.7720. Consistent with OOF 8.84 +/- 0.96 (no distribution shift)."
    path: /home/visilant/CLEAR-EC-phase1-v2ens/results/phase1_v2ens
  - campaign: cnn_20260913
    run: "c0_slot2 (v2ens_refit12 container)"
    date: "2026-09-13"
    model: "v2ens (5x ConvNeXt-V2-Tiny w=2 + 5x ConvNeXt-Tiny w=1) + 2x all-data ConvNeXt-V2-Tiny refits (seeds 123/7, w=2), geometric mean, flip TTA"
    split: oof9000
    n: 9000
    CD: 6.3000
    CV: 10.2515
    HEX: 9.9652
    mean: 8.8389
    status: "built, not uploaded"
    verdict: "Score is the fold-only part (= v2ens); the refits saw every label and cannot be validated. Weight search: V2-Base w=3 would give OOF 8.814 (delta -0.025, CI -0.036 to -0.012) but costs 17.8 s/image on the A5000, so excluded. Image clear_ec_phase1:v2ens_refit12; 50-case replay max rel diff 3.3e-7; 15.2 s/case on a shared GPU 0. See results/cnn_20260913/c0_slot2/REPORT.md."
    path: /home/visilant/CLEAR-EC-phase1-v2ens/results/phase1_v2ens_refit12
  - campaign: platform
    run: "leaderboard snapshot"
    date: "2026-09-11"
    split: platform100
    n: 100
