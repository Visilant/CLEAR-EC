# Hand-maintained facts the ledger cannot read from results/ (prose-only numbers, verdicts, deletions).
# Regenerate docs/EXPERIMENTS.md with: cd code && .venv/bin/python -m experiments.run ledger

campaigns:  # display titles and one-line summaries per results/<dir>; order is chronological
  eda: {date: "2026-08-26", title: "Exploratory data analysis", summary: "Label distributions, image statistics, annotated-box vs random-crop overlap (IoU about 0.16), baseline error anatomy. No model rows; see results/eda/."}
  overnight: {date: "2026-08-27", title: "August baseline: Cellpose, ridge calibration, small CNN", summary: "Slide-disjoint train/val/test protocol; frozen Cellpose config diameter_40 crop 0.5; one-shot test scores."}
  audit_20260911: {date: "2026-09-11", title: "Readiness audit", summary: "Fixed checkpoint selection, cache clobbering and scoring joins (AUDIT.md); the corrected 10-epoch small CNN is the first credible model."}
  convnext_20260911: {date: "2026-09-11", title: "ConvNeXt-Tiny whole-image and patch arms", summary: "Six arms at seed 123, 20 epochs, best-epoch selection on the 892 val split. No REPORT.md; numbers from metrics.json."}
  round1_20260912_002113: {date: "2026-09-12", title: "Round 1: BatchNorm vs GroupNorm x seeds (small CNN)", summary: "Paired slide-clustered CIs against the audited incumbent; the ensemble gain missed the 0.2 gate."}
  night_20260912: {date: "2026-09-12", title: "Night of 2026-09-12: stabilized recipe, folds, refits, exploration", summary: "EMA + cosine + fixed budget removed the epoch swings; ConvNeXt-V2-Tiny wins every fold; ten-model ensemble OOF 8.84 became slot 1."}
  long_training_20260912_40ep: {date: "2026-09-12", title: "Long training screen (two folds, 8 to 40 epochs)", summary: "Matched 8-epoch cosine prefix then constant LR; longer is slightly worse."}
  noise_floor_20260912: {date: "2026-09-12", title: "Label-noise floor and the last two levers", summary: "Counting and process-noise floors from the 25 overlays; residual anatomy; label cleaning (B1) and V2-Base capacity (B3) both fail their gates."}
  sam_spike_20260912: {date: "2026-09-12", title: "SAM / Cellpose-SAM center-detection spike", summary: "Detector + Voronoi readout; every pre-registered gate failed. Code in code/phase2/detector."}
  smoke_runner: {date: "2026-09-13", title: "Runner smoke test", summary: "Two-epoch small CNN through experiments/run.py; not a result."}
  cnn_20260913: {date: "2026-09-13", title: "Line C (2026-09-13): direct CNN, slot-2 candidate and screens", summary: "C0: slot-2 candidates v2ens_refit12 and v2ens_plus (17 members, OOF 8.814) built, replayed, not uploaded. Screens: trimmed loss, density head, scale jitter all lose; highres and Small five-fold families add <= 0.005 to the ensemble (C5). Nothing approaches the one-point goal."}

  detector_20260913: {date: "2026-09-13", title: "Line S (2026-09-13): trained cell-centre heatmap detector", summary: "S1 U-Net on 19 overlays (test recall 0.891, F1 0.901, count ratio 0.98); S2 readout over 9,000 (val-892 CD MAPE 10.1 vs CNN 6.32, stack adds nothing); S3 count-supervised retrain (direct-count CD ~8 on a val subset). Gates failed; Phase II material."}

rows:  # facts that exist nowhere in machine-readable form
